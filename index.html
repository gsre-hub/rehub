<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RE Hub</title>
<meta name="theme-color" content="#F5F6F3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="RE Hub">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F5F6F3;--card:#fff;--line:#E3E6E1;--line2:#EEF0EC;--ink:#17201B;--mut:#5A645E;--ok:#0E6B58;--okbg:#E3F2EE;--warn:#9A4A06;--warnbg:#FFF4EC;--warnln:#F3D3BC;--bad:#B42318;--chip:#E8EBE6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
a{color:var(--ok);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.top{padding:18px 20px 8px}
.fecha{font-size:13px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1;min-width:0}
h1{margin:0;font-size:28px;font-weight:650;letter-spacing:-.3px}
h2{margin:0;font-size:15px;font-weight:600}
.sec{padding:18px 20px 0;display:flex;flex-direction:column;gap:8px}
.sech{display:flex;justify-content:space-between;align-items:baseline}
.sech button{font-size:13px;background:none;border:0;color:var(--ok);padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.list>.it{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2)}
.list>.it:last-child{border-bottom:0}
.t{font-size:14px;font-weight:500}
.s{font-size:12px;color:var(--mut)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.amt{font-size:14px;font-weight:600;white-space:nowrap}
.tiles{padding:8px 20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left}
.tile b{font-size:26px;font-weight:650}
.tile span{font-size:12px;color:var(--mut)}
.tile.warn{background:var(--warnbg);border-color:var(--warnln)}.tile.warn b{color:var(--warn)}
.day{width:42px;display:flex;flex-direction:column;align-items:center;flex:none}
.day span{font-size:11px;color:var(--mut)}.day b{font-size:18px}
.dot{width:10px;height:10px;border-radius:5px;flex:none}
.badge{font-size:11px;font-weight:600;border-radius:6px;padding:3px 6px;white-space:nowrap}
.b-alta{background:var(--bad);color:#fff}.b-media{background:var(--chip)}.b-baja{background:var(--chip);color:var(--mut)}
.pill{font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px;white-space:nowrap}
.p-ok{color:var(--ok);background:var(--okbg)}.p-warn{color:var(--warn);background:var(--warnbg)}.p-mut{background:var(--chip)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.note{font-size:12px;color:var(--mut);padding:0 4px}
.piso{padding:14px;display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}
.code{font-size:12px;font-weight:650;color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line2);padding-top:10px}
.stats div{display:flex;flex-direction:column}.stats span{font-size:11px;color:var(--mut)}.stats b{font-size:15px}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(92px + env(safe-area-inset-bottom));height:52px;padding:0 20px;border-radius:26px;background:var(--ok);color:#fff;border:0;font-size:15px;font-weight:600;box-shadow:0 6px 18px rgba(14,107,88,.28);display:flex;align-items:center;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:none;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--ok);font-weight:600}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.back{width:44px;height:44px;border-radius:22px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.seg{display:flex;gap:6px;background:var(--chip);border-radius:12px;padding:4px;margin:0 20px}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:none;font-size:14px;color:#3F4842}
.seg button.on{background:#fff;font-weight:600;color:var(--ink)}
.bars{height:110px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end;border-bottom:1px solid var(--line)}
.bars>div{display:flex;gap:3px;align-items:flex-end;height:100%}
.bars i{flex:1;border-radius:3px 3px 0 0;display:block}
.lbls{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;font-size:11px;color:var(--mut);text-align:center}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);width:100%}
.btn.pri{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn:disabled{opacity:.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:0 15px;border-radius:21px;border:1px solid #D5DAD4;background:#fff;font-size:14px}
.chips button.on{border:1.5px solid var(--ok);background:var(--okbg);color:#0A5242;font-weight:600}
label.f{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
textarea,input[type=text],input[type=date]{width:100%;border-radius:14px;border:1px solid #D5DAD4;background:#fff;padding:12px 14px;font:16px -apple-system,system-ui,sans-serif;color:var(--ink);-webkit-appearance:none}
textarea{resize:none}
.form{padding:14px 20px 24px;display:flex;flex-direction:column;gap:18px}
.det{padding:0 14px 12px;font-size:13px;color:#3F4842;display:none;flex-direction:column;gap:4px}
.open .det{display:flex}
.empty{padding:14px;font-size:14px;color:var(--mut)}
.load{padding:60px 20px;text-align:center;color:var(--mut)}
.err{margin:12px 20px;padding:12px 14px;border-radius:12px;background:#FDECEA;color:var(--bad);font-size:13px}
.info{margin:12px 20px 0;padding:10px 14px;border-radius:12px;background:var(--chip);font-size:13px;color:#3F4842}
.fresh{font-size:11px;color:var(--mut);text-align:center;padding:18px 0 0}
/* bloqueo */
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top)) 24px 24px;gap:18px}
#lock .logo{width:64px;height:64px;border-radius:16px}
#lock h1{font-size:22px;text-align:center}
#lock p{margin:0;text-align:center;color:var(--mut);font-size:14px;max-width:340px}
.dots{display:flex;gap:14px;height:16px}
.dots i{width:14px;height:14px;border-radius:7px;border:2px solid var(--ink);display:block}
.dots i.on{background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px 22px;margin-top:6px}
.pad button{width:76px;height:76px;border-radius:38px;border:0;background:#fff;font-size:28px;font-weight:400;box-shadow:0 1px 0 var(--line)}
.pad button.x{background:none;box-shadow:none;font-size:15px;color:var(--ok)}
.lockerr{color:var(--bad);font-size:13px;min-height:18px;text-align:center}
#lock textarea{max-width:420px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
#lock .btn{max-width:420px}
</style>
</head>
<body>
<div id="lock"></div>
<div id="app"></div>
<nav id="nav">
  <button data-t="hoy" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4z"/></svg>Hoy</button>
  <button data-t="pisos"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h2M13 8h2M9 12h2M13 12h2M10 21v-4h4v4"/></svg>Pisos</button>
  <button data-t="inc"><svg viewBox="0 0 24 24"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>Incidencias</button>
</nav>
<script src="app.js"></script>
</body>
</html>
